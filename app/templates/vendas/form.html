{% extends "base.html" %}

{% block title %}Nova Venda - SISCONT{% endblock %}

{% block page_title %}Iniciar Nova Venda{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-body p-4">
                <form method="post">
                    <div class="row mb-3">
                        <div class="col-md-8">
                            <label for="cliente_id" class="form-label fw-bold small">Cliente</label>
                            <select class="form-select" id="cliente_id" name="cliente_id" required>
                                <option value="">Selecione um cliente...</option>
                                {% for c in clientes %}
                                <option value="{{ c.id }}">{{ c.nome }} ({{ c.cnpj_cpf }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="modalidade" class="form-label fw-bold small">Modalidade</label>
                            <select class="form-select" id="modalidade" name="modalidade" required>
                                <option value="VENDA">VENDA (DICOM)</option>
                                <option value="LICITACAO">LICITACAO (DIPRO)</option>
                                <option value="PRODUCAO">PRODUCAO (DIPRO)</option>
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="linha_produto_id" class="form-label fw-bold small">Linha de Produto</label>
                            <select class="form-select" id="linha_produto_id" name="linha_produto_id" required>
                                <option value="">Selecione a linha...</option>
                                {% for l in linhas %}
                                <option value="{{ l.id }}">{{ l.nome }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="processo_sei" class="form-label fw-bold small">Processo SEI</label>
                            <input type="text" class="form-control" id="processo_sei" name="processo_sei"
                                placeholder="Ex: 00000.000.../2026">
                        </div>
                        <div class="col-md-4">
                            <label for="numero" class="form-label fw-bold small">Número OS (Opcional)</label>
                            <input type="text" class="form-control" id="numero" name="numero"
                                placeholder="Ex: OS-12345">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="objeto" class="form-label fw-bold small">Objeto / Descrição da Venda</label>
                        <textarea class="form-control" id="objeto" name="objeto" rows="4" required
                            placeholder="Descreva brevemente o que está sendo vendido..."></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2 border-top pt-3">
                        <a href="/vendas" class="btn btn-light px-4">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4">Iniciar Venda</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
