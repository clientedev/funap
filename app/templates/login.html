<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SISCONT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="{{ url_for('static', path='/css/styles.css') }}" rel="stylesheet">
</head>

<body class="login-body">
    <div class="login-card shadow-lg">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', path='/img/logo.png') }}" alt="FUNAP Logo" class="login-logo"
                onerror="this.style.display='none'">
            <h4 class="fw-bold text-success">SISCONT</h4>
            <p class="text-muted small">Sistema de Controle de Vendas</p>
        </div>

        {% if request.query_params.get('error') %}
        <div class="alert alert-danger border-0 small mb-4">
            <i class="fas fa-exclamation-circle me-2"></i> {{ request.query_params.get('error') }}
        </div>
        {% endif %}

        <form action="/login" method="post">
            <div class="mb-3">
                <label for="username" class="form-label small fw-bold">E-mail</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0"><i class="fas fa-envelope text-muted"></i></span>
                    <input type="email" class="form-control border-0 bg-light" id="username" name="username" required
                        placeholder="seu@email.com">
                </div>
            </div>
            <div class="mb-4">
                <label for="password" class="form-label small fw-bold">Senha</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-0"><i class="fas fa-lock text-muted"></i></span>
                    <input type="password" class="form-control border-0 bg-light" id="password" name="password" required
                        placeholder="********">
                </div>
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary py-2 fw-bold shadow-sm">
                    ENTRAR <i class="fas fa-sign-in-alt ms-2"></i>
                </button>
            </div>
        </form>

        <div class="mt-4 text-center">
            <hr>
            <p class="text-muted small mb-0">© 2026 - FUNAP SISCONT</p>
        </div>
    </div>
</body>

</html>
