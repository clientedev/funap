{% extends "base.html" %}

{% block title %}Pesquisa Avançada - SISCONT{% endblock %}

{% block page_title %}Pesquisa Avançada{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <h6 class="mb-0 fw-bold text-primary"><i class="fas fa-search me-2"></i> Filtros de Busca</h6>
            </div>
            <div class="card-body p-4">
                <form action="/vendas" method="get">
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Nome do Cliente</label>
                            <input type="text" name="q" class="form-control" placeholder="Ex: Prefeitura Municipal...">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Status da Venda</label>
                            <select name="status" class="form-select">
                                <option value="">Todos</option>
                                <option value="em_andamento">Em Andamento</option>
                                <option value="aguardando_proposta">Aguardando Proposta</option>
                                <option value="aguardando_empenho">Aguardando Empenho</option>
                                <option value="faturado">Faturado</option>
                                <option value="finalizada">Finalizada</option>
                                <option value="cancelada">Cancelada</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Número da Proposta</label>
                            <input type="text" name="proposta_num" class="form-control" placeholder="P-2024-...">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Linha de Produto</label>
                            <select name="linha_produto_id" class="form-select">
                                <option value="">Todas</option>
                                {% for l in linhas %}
                                <option value="{{ l.id }}">{{ l.nome }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Número do Pedido</label>
                            <input type="text" name="pedido_num" class="form-control" placeholder="PED-...">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Status do Pedido</label>
                            <select name="pedido_status" class="form-select">
                                <option value="">Todos</option>
                                <option value="pendente">Pendente</option>
                                <option value="finalizado">Finalizado</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Número da Nota Fiscal</label>
                            <input type="text" name="nfe_num" class="form-control" placeholder="NF-...">
                        </div>
                        <div class="col-md-3">
                            <label class="form-label small fw-bold">Status da Proposta</label>
                            <select name="proposta_status" class="form-select">
                                <option value="">Todos</option>
                                <option value="pendente">Pendente</option>
                                <option value="aprovada">Aprovada</option>
                                <option value="cancelada">Cancelada</option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <button type="reset" class="btn btn-light px-4">Limpar Filtros</button>
                        <button type="submit" class="btn btn-primary px-5 fw-bold">
                            <i class="fas fa-search me-2"></i> BUSCAR AGORA
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
