{% extends "base.html" %}

{% block title %}{% if linha %}Editar Linha{% else %}Nova Linha{% endif %} - SISCONT{% endblock %}

{% block page_title %}{% if linha %}Editar Linha{% else %}Nova Linha{% endif %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-body p-4">
                <form method="post">
                    <div class="mb-3">
                        <label for="nome" class="form-label fw-bold small">Nome da Linha</label>
                        <input type="text" class="form-control" id="nome" name="nome"
                            value="{{ linha.nome if linha else '' }}" required placeholder="Ex: Mobiliário Escolar">
                    </div>
                    <div class="mb-4">
                        <label for="descricao" class="form-label fw-bold small">Descrição</label>
                        <textarea class="form-control" id="descricao" name="descricao" rows="4"
                            placeholder="Detalhes sobre esta linha de produção...">{{ linha.descricao if linha else '' }}</textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="/linhas-produto" class="btn btn-light px-4">Cancelar</a>
                        <button type="submit" class="btn btn-primary px-4">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
